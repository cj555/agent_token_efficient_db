# 运行参数（与合约分离：改这里不影响数据契约）
dataset: example__gdp

ingest:
  enabled: true
  source_id: "example_worldbank_gdp"      # 对应 data_contracts/external_sources.yaml
  mode: incremental               # full | incremental
  skip_if_fingerprint_match: true # raw manifest 命中即跳过下载（多 dataset 共享 source 时省带宽）

transform:
  enabled: true
  mode: standard                  # standard | passthrough
  write_mode: overwrite           # overwrite | append
  partition_by: []

runtime:
  # 本阶段允许的进程峰值内存（GB）。dw run 每次实测并与之核对。
  # 示例数据集只有几千行，0.2 GB 绰绰有余。
  memory_estimate_gb: 0.2
  timeout_seconds: 1800
  retries: 2
