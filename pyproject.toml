[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwlib"
version = "0.1.0"
description = "Token-efficient, decoupled local data warehouse toolkit for Claude Code"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
dw = "dwlib.cli:main"

[tool.setuptools]
packages = ["dwlib"]

[tool.setuptools.package-data]
dwlib = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "datasets"]
python_files = ["test_*.py"]
# 各 dataset 的 tests/ 目录里文件名重复（每个都有 test_contract.py），
# importlib 模式按路径而非包名导入，避免模块名冲突。
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
